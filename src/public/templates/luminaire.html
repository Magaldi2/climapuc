<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima PUC - Controle de Luminárias</title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='clima.png') }}"
      type="image/png"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Roboto", sans-serif;
        background: #1f2a44;
        color: #fff;
        min-height: 100vh;
        display: flex;
      }

      .sidebar {
        width: 80px;
        height: 100vh;
        position: fixed;
        background-color: #2a3550;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 0;
        transition: transform 0.2s ease-in-out;
        z-index: 1000;
      }
      .sidebar.hide {
        transform: translateX(-100%);
      }
      .sidebar img.logo {
        width: 80px;
        margin-bottom: 30px;
      }
      .sidebar .nav-item {
        margin: 20px 0;
        cursor: pointer;
        color: #fff;
      }
      .sidebar .nav-item a {
        color: inherit;
        text-decoration: none;
      }
      .sidebar .nav-item i {
        font-size: 1.8em;
      }
      .sidebar .nav-item.who-we-are {
        margin-top: auto;
      }

      .main-content {
        margin-left: 80px;
        padding: 15px;
        width: calc(100% - 80px);
        transition: margin-left 0.3s ease-in-out;
        overflow-y: auto;
      }
      .sidebar.hide + .main-content {
        margin-left: 0;
        width: 100%;
      }

      .top-bar {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }
      .menu-btn {
        background: none;
        border: none;
        color: #fff;
        font-size: 2em;
        cursor: pointer;
      }
      .top-bar h1 {
        font-size: 2.5em;
        text-align: center;
        flex-grow: 1;
      }
      .top-bar .dummy {
        width: 2.2em;
      }

      #map {
        height: 75vh;
        width: 100%;
        border-radius: 15px;
        margin-bottom: 20px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      }

      .leaflet-tooltip {
        background-color: rgba(47, 59, 88, 0.9) !important;
        color: #ffffff !important;
        border: 1px solid #02d7fd !important;
        border-radius: 5px !important;
        padding: 8px 12px !important;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3) !important;
        font-size: 0.9em !important;
      }
      .leaflet-tooltip-top:before,
      .leaflet-tooltip-bottom:before,
      .leaflet-tooltip-left:before,
      .leaflet-tooltip-right:before {
        background: rgba(47, 59, 88, 0.9) !important;
      }

      /* Estilos para o Modal de Configuração */
      .modal {
        display: none;
        position: fixed;
        z-index: 2000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.7);
        padding-top: 40px;
      }
      .modal-content {
        background-color: #2f3b58;
        color: #fff;
        margin: 2% auto;
        padding: 30px;
        border: 1px solid #02d7fd;
        border-radius: 10px;
        width: 90%;
        max-width: 650px; /* Aumentado max-width */
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        position: relative;
      }
      .modal-close-button {
        color: #aaa;
        float: right;
        font-size: 30px;
        font-weight: bold;
        line-height: 0.8;
      }
      .modal-close-button:hover,
      .modal-close-button:focus {
        color: #02d7fd;
        text-decoration: none;
        cursor: pointer;
      }
      .modal-content h3 {
        color: #ffd700;
        margin-bottom: 20px;
        text-align: center;
        font-size: 1.8em;
      }
      .modal-content p {
        margin-bottom: 15px;
        text-align: center;
        font-size: 1.1em;
      }
      .modal-content hr {
        border-color: rgba(255, 255, 255, 0.2);
        margin: 20px 0;
      }

      /* Estilos para o controle de Dimmer */
      .dimmer-control-container {
        margin-bottom: 20px;
        text-align: center;
      }
      .dimmer-control-container label {
        display: block;
        margin-bottom: 10px;
        font-size: 1.1em;
        color: #fff;
      }
      .dimmer-control-container #dimmerValueDisplay {
        font-weight: bold;
        color: #02d7fd;
      }
      .dimmer-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 80%;
        height: 10px;
        background: #555;
        outline: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 5px;
      }
      .dimmer-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        background: #02d7fd;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #fff;
      }
      .dimmer-slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: #02d7fd;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #fff;
      }

      .modal-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
      } /* Centralizado */
      .modal-controls button {
        padding: 12px 25px;
        background-color: #02d7fd;
        color: #1f2a44;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1em; /* Aumentado */
        flex-grow: 0; /* Não cresce */
        min-width: 120px;
      }
      .modal-controls button:hover {
        background-color: #0197c1;
      }

      @media (max-width: 768px) {
        .top-bar h1 {
          font-size: 1.8em;
        }
        #map {
          height: 65vh;
        }
        .main-content {
          margin-left: 0;
          width: 100%;
        }
        .sidebar.hide + .main-content {
          margin-left: 0;
        }
        .modal-content {
          width: 95%;
          max-width: 95%;
          margin-top: 5%;
          padding: 20px;
        }
        .modal-content h3 {
          font-size: 1.5em;
        }
        .modal-controls button {
          font-size: 0.9em;
          padding: 10px 15px;
          min-width: 100px;
        }
        .dimmer-slider {
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <aside class="sidebar" id="sidebar">
      <div>
        <a href="/">
          <img
            src="{{ url_for('static', filename='loguinho.png') }}"
            alt="PUC Logo"
            width="50"
          />
        </a>
      </div>
      <div class="nav-item">
        <a href="/temperatura" title="Gráfico de Temperatura">
          <i class="fas fa-thermometer-half"></i>
        </a>
      </div>
      <div class="nav-item">
        <a href="/dados" title="Dashboard de Dados">
          <i class="fas fa-chart-line"></i>
        </a>
      </div>
      <div class="nav-item">
        <a href="/luminaires" title="Controle de Luminárias">
          <i class="fas fa-lightbulb"></i>
        </a>
      </div>
      <div class="nav-item">
        <a href="/sensor" title="Sensores">
          <i class="fas fa-microchip"></i>
        </a>
      </div>
      <div class="nav-item who-we-are">
        <a href="/about" title="Sobre Nós">
          <i class="fas fa-info-circle"></i>
        </a>
      </div>
    </aside>

    <div class="main-content" id="mainContent">
      <div class="top-bar">
        <button class="menu-btn" onclick="toggleSidebarVisibility()">
          <i class="fas fa-bars"></i>
        </button>
        <h1>Controle de Luminárias</h1>
        <div class="dummy"></div>
      </div>
      <div id="map"></div>
      <div id="logs-table">
        <h1>Registro dos Tokens</h1>
      </div>
    </div>

    <div id="configModal" class="modal">
      <div class="modal-content">
        <span class="modal-close-button" onclick="closeConfigModal()"
          >&times;</span
        >
        <h3 id="modalLuminaireName">Nome da Luminária</h3>
        <p id="modalLuminaireStatus">Status: Desconhecido</p>
        <hr />
        <div class="dimmer-control-container">
          <label for="dimmerSlider"
            >Intensidade do Dimmer:
            <span id="dimmerValueDisplay">50</span>%</label
          >
          <input
            type="range"
            id="dimmerSlider"
            min="0"
            max="100"
            value="50"
            class="dimmer-slider"
            oninput="updateDimmerValueDisplay(this.value)"
            onchange="controlLuminaire('set_dimmer', this.value)"
          />
        </div>
        <hr />
        <div class="modal-controls">
          <button onclick="controlLuminaire('on')">Ligar</button>
          <button onclick="controlLuminaire('off')">Desligar</button>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      function toggleSidebarVisibility() {
        const sb = document.getElementById("sidebar");
        const mc = document.getElementById("mainContent");
        sb.classList.toggle("hide");
        mc.style.marginLeft = sb.classList.contains("hide") ? "0" : "80px";
      }

      let selectedLuminaireId = null;
      let serialLuminaire = null;
      let dimmerValue = null;

      function updateDimmerValueDisplay(value) {
        document.getElementById("dimmerValueDisplay").textContent = value;
      }

      function prepareAndOpenConfigModal(luminaireId) {
        const luminaire = luminairesData.find((l) => l.id === luminaireId);
        if (luminaire) {
          selectedLuminaireId = luminaire.id;
          serialLuminaire = luminaire.serial;

          document.getElementById("modalLuminaireName").textContent =
            luminaire.name;
          document.getElementById(
            "modalLuminaireStatus"
          ).textContent = `Status: ${luminaire.status || "N/A"}`;

          // Buscar valor real da API antes de abrir o modal
          fetch(`/api/luminaires?id=${luminaire.id}`)
            .then((res) => res.json())
            .then((data) => {
              // Aqui você pega o valor real do dimmer da API
              const realLum = Array.isArray(data) ? data[0] : data;
              const currentDimmerLevel =
                realLum && realLum.dimmer_level !== undefined
                  ? realLum.dimmer_level
                  : 50; // valor padrão se não vier da API

              document.getElementById("dimmerSlider").value =
                currentDimmerLevel;
              updateDimmerValueDisplay(currentDimmerLevel);

              document.getElementById("configModal").style.display = "block";
            })
            .catch(() => {
              // fallback para valor local se a API falhar
              const currentDimmerLevel =
                luminaire.dimmer_level !== undefined
                  ? luminaire.dimmer_level
                  : document.getElementById("dimmerSlider").value;
              document.getElementById("dimmerSlider").value =
                currentDimmerLevel;
              updateDimmerValueDisplay(currentDimmerLevel);

              document.getElementById("configModal").style.display = "block";
            });
        }
      }
      function closeConfigModal() {
        document.getElementById("configModal").style.display = "none";
      }

      function controlLuminaire(action, value = null) {
        if (serialLuminaire !== null) {
          let url = "/api/state";
          let payload = { lampSerial: serialLuminaire };

          if (action === "on") {
            payload.dimmerValue = 100;
            // Atualiza o objeto da luminária
            const lum = luminairesData.find(
              (l) => l.serial === serialLuminaire
            );
            if (lum) lum.dimmer_level = 100;
          } else if (action === "off") {
            payload.dimmerValue = 0;
            const lum = luminairesData.find(
              (l) => l.serial === serialLuminaire
            );
            if (lum) lum.dimmer_level = 0;
          } else if (action === "set_dimmer" && value !== null) {
            payload.dimmerValue = parseInt(value);
            const lum = luminairesData.find(
              (l) => l.serial === serialLuminaire
            );
            if (lum) lum.dimmer_level = parseInt(value);
          } else {
            alert("Ação desconhecida.");
            return;
          }

          fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.message) {
                alert(data.message);
              } else if (data.error) {
                alert("Erro: " + data.error);
              }
            })
            .catch((err) => {
              alert("Erro na requisição: " + err);
            });
        } else {
          alert("Nenhuma luminária selecionada para controle.");
        }
      }

      const luminairesData = JSON.parse('{{ luminaires_data|tojson|safe }}');
      const map = L.map("map").setView([-22.83408, -47.04319], 16);


      L.tileLayer(
        "https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?key=RZXpb9LpxsGCRktNA6mT",
        {
          attribution:
            '&copy; <a href="https://www.maptiler.com/">MapTiler</a> & <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
          tileSize: 512,
          zoomOffset: -1,
          minZoom: 1,
          maxZoom: 20,
        }
      ).addTo(map);


      if (luminairesData && luminairesData.length > 0) {
        luminairesData.forEach((luminaire) => {
          const marker = L.marker([luminaire.lat, luminaire.lon]).addTo(map);

          marker.bindTooltip(
            `<strong>${luminaire.name}</strong><br>ID: ${
              luminaire.id
            }<br>Status: ${luminaire.status || "N/A"}`,
            {
              direction: "top",
              offset: L.point(
                0,
                -(marker.options.icon.options.iconSize
                  ? marker.options.icon.options.iconSize[1] / 2
                  : 20)
              ),
              permanent: false,
              sticky: true,
            }
          );

          marker.on("click", function () {
            prepareAndOpenConfigModal(luminaire.id);
          });
        });
      } else {
        console.warn("Nenhum dado de luminária para exibir no mapa.");
      }

      function controlLuminaire(action, value = null) {
        if (serialLuminaire !== null) {
          let url = "/api/state";
          let payload = { lampSerial: serialLuminaire };

          if (action === "on") {
            payload.dimmerValue = 100;
          } else if (action === "off") {
            payload.dimmerValue = 0;
          } else if (action === "set_dimmer" && value !== null) {
            payload.dimmerValue = parseInt(value);
          } else {
            alert("Ação desconhecida.");
            return;
          }

          fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.message) {
                alert(data.message);
              } else if (data.error) {
                alert("Erro: " + data.error);
              }
            })
            .catch((err) => {
              alert("Erro na requisição: " + err);
            });
        } else {
          alert("Nenhuma luminária selecionada para controle.");
        }
      }

      window.onclick = function (event) {
        const modal = document.getElementById("configModal");
        if (event.target == modal) {
          closeConfigModal();
        }
      };
    </script>
  </body>
</html>
