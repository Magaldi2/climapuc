<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima PUC - Sobre Nós</title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='clima.png') }}"
      type="image/png"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* CSS o mais simples possível para este layout */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Roboto", sans-serif;
        background: #1f2a44;
        color: #fff;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 80px;
        height: 100vh;
        background-color: #2a3550;
        transition: transform 0.3s ease-in-out;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 0;
      }
      .sidebar.hide {
        transform: translateX(-100%);
      }
      .sidebar .nav-item {
        margin: 20px 0;
      }
      .sidebar .nav-item a {
        color: inherit;
        text-decoration: none;
      }
      .sidebar .nav-item i {
        font-size: 1.8em;
      }

      .main-content {
        padding: 15px;
        transition: margin-left 0.3s ease-in-out;
      }

      .top-bar {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }
      .menu-btn {
        background: none;
        border: none;
        color: #fff;
        font-size: 2em;
        cursor: pointer;
      }
      .top-bar h1 {
        font-size: 3em;
        text-align: center;
        flex-grow: 1;
      }
      .top-bar .dummy {
        width: 2.2em;
      }

      .about-list {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-top: 20px;
      }

      /* BOXES */
      .member-card {
        background-color: #2f3b58;
        border-radius: 15px;
        padding: 25px;
        width: 340px;
        text-align: center;
        transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      }

      .member-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .member-card img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
      }

      .member-card h3 {
        font-size: 1.9em;
        margin-bottom: 12px;
        color: #ffd700;
      }

      .member-card .links a {
        margin: 0 12px;
        color: #02d7fd;
        font-size: 1.6em;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div>
        <a href="/">
          <img
            src="{{ url_for('static', filename='loguinho.png') }}"
            alt="PUC Logo"
            width="50"
          />
        </a>
      </div>
      <div class="nav-item">
        <a href="/temperatura" title="Gráfico de Temperatura">
          <i class="fas fa-thermometer-half"></i>
        </a>
      </div>
      <div class="nav-item">
        <a href="/dados" title="Dashboard de Dados">
          <i class="fas fa-chart-line"></i>
        </a>
      </div>
      <div class="nav-item">
        <a href="/luminaires" title="Controle de Luminárias">
          <i class="fas fa-lightbulb"></i>
        </a>
      </div>
      <div class="nav-item">
        <a href="/sensor" title="Sensores">
          <i class="fas fa-microchip"></i>
        </a>
      </div>
    </aside>

    <div class="main-content" id="mainContent">
      <div class="top-bar">
        <button class="menu-btn" onclick="toggleSidebarVisibility()">
          <i class="fas fa-bars"></i>
        </button>
        <h1>Quem Somos</h1>
        <div class="dummy"></div>
      </div>

      <h2 style="text-align: center; margin-top: 30px">
        Criadores do ClimaPUC

      <div class="about-list">
        <div class="member-card">

          />
          <h3>Lucas Magaldi</h3>
          <div class="links">
            <a href="https://github.com/Magaldi2" target="_blank"
              ><i class="fab fa-github"></i
            ></a>
            <a
              href="https://www.linkedin.com/in/lucas-magaldi-2a3988222/"
              target="_blank"
              ><i class="fab fa-linkedin"></i
            ></a>
          </div>
        </div>
        <div class="member-card">
          <img
            src="{{ url_for('static', filename='konda.jpeg') }}"
            alt="Felipe Konda"
          />
          <h3>Felipe Konda</h3>
          <div class="links">
            <a href="https://github.com/FelipeDiasKonda" target="_blank"
              ><i class="fab fa-github"></i
            ></a>
            <a
              href="https://www.linkedin.com/in/felipe-konda-07a5402a5/"
              target="_blank"
              ><i class="fab fa-linkedin"></i
            ></a>
          </div>
        </div>
        <div class="member-card">
          <img
            src="{{ url_for('static', filename='tue.jpeg') }}"
            alt="Matheus Anitelli"
          />
          <h3>Matheus Anitelli</h3>
          <div class="links">
            <a href="https://github.com/mttue7" target="_blank"
              ><i class="fab fa-github"></i
            ></a>
            <a href="http://linkedin.com/in/matheus-anitelli/" target="_blank"
              ><i class="fab fa-linkedin"></i
            ></a>
          </div>
        </div>
      </div>

      <h2 style="text-align: center; margin-top: 50px">
        Membros que Entraram Depois
      </h2>
      <div class="about-list">
        <div class="member-card">
          <img
            src="{{ url_for('static', filename='andrade.jpg') }}"
            alt="Guilherme Andrade"
          />
          <h3>Guilherme Andrade</h3>
          <div class="links">
            <a href="https://github.com/guiandradedev" target="_blank"
              ><i class="fab fa-github"></i
            ></a>
            <a href="https://www.linkedin.com/in/guiandradedev/" target="_blank"
              ><i class="fab fa-linkedin"></i
            ></a>
          </div>
        </div>
        <div class="member-card">
          <img
            src="{{ url_for('static', filename='ximenes.jpg') }}"
            alt="Guilherme Ximenes"
          />
          <h3>Guilherme Ximenes</h3>
          <div class="links">
            <a href="https://github.com/ximeninh0" target="_blank"
              ><i class="fab fa-github"></i
            ></a>
            <a
              href="https://www.linkedin.com/in/guiximenes/?miniProfileUrn=urn%3Ali%3Afsd_profile%3AACoAAE1ni0oBoKK9-NQqBmdmTKRifjRn_2LIEos"
              target="_blank"
              ><i class="fab fa-linkedin"></i
            ></a>
          </div>
        </div>
      </div>

      <h2 style="text-align: center; margin-top: 50px">
        Professores que nos Ajudaram
      </h2>
      <div class="about-list">
        <div class="member-card">
          <img
            src="{{ url_for('static', filename='cesar.jpg') }}"
            alt="Professor 1"
          />
          <h3>César Quiroz</h3>
          <div class="links">
            <a href="https://www.linkedin.com/in/cesarhcq/" target="_blank"
              ><i class="fab fa-linkedin"></i
            ></a>
          </div>
        </div>
        <div class="member-card">
          <img
            src="{{ url_for('static', filename='alexandre.jpg') }}"
            alt="Professor 2"
          />
          <h3>Alexandre M. Ribeiro</h3>
          <div class="links">
            <a href="" target="_blank"><i class="fab fa-linkedin"></i></a>
          </div>
        </div>
        <div class="member-card">
          <img
            src="{{ url_for('static', filename='pedro.jpg') }}"
            alt="Pedro"
          />
          <h3>Pedro</h3>
          <div class="links"></div>
        </div>
      </div>
    </div>
    <script>
      function applyLayout() {
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.getElementById("mainContent");

        if (sidebar.classList.contains("hide")) {
          mainContent.style.marginLeft = "0px";
        } else {
          mainContent.style.marginLeft = "80px";
        }
      }

      function toggleSidebarVisibility() {
        document.getElementById("sidebar").classList.toggle("hide");
        applyLayout();
      }

      document.addEventListener("DOMContentLoaded", applyLayout);
    </script>
  </body>
</html>
