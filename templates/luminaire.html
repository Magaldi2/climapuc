<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima PUC - Controle de Luminárias</title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='clima.png') }}"
      type="image/png"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Estilos Globais e Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Roboto", sans-serif;
        background: #1f2a44;
        color: #fff;
        min-height: 100vh;
        display: flex; /* Usado para layout da sidebar e conteúdo principal */
      }

      /* === INÍCIO ESTILOS SIDEBAR === */
      .sidebar {
        /* Dimensões e Posição da Sidebar */
        width: 80px;
        height: 100vh; /* Altura total da tela */
        position: fixed; /* Fixa na tela */
        /* Aparência da Sidebar */
        background-color: #2a3550;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 0;
        transition: transform 0.2s ease-in-out;
        z-index: 1000;
      }
      .sidebar.hide {
        transform: translateX(-100%); /* Esconde a sidebar */
      }
      /* Estilos para o Logo na Sidebar */
      .sidebar img.logo {
        width: 50px; /* Largura do logo */
        margin-bottom: 30px;
      }
      /* Estilos para Itens de Navegação na Sidebar */
      .sidebar .nav-item {
        margin: 20px 0;
        cursor: pointer;
        color: #fff;
      }
      .sidebar .nav-item a {
        color: inherit;
        text-decoration: none;
      }
      .sidebar .nav-item i {
        font-size: 1.8em; /* Tamanho dos ícones */
      }
      .sidebar .nav-item.who-we-are {
        margin-top: auto; /* Alinha o item "Sobre Nós" na parte inferior */
      }
      /* === FIM ESTILOS SIDEBAR === */

      /* === INÍCIO ESTILOS CONTEÚDO PRINCIPAL === */
      .main-content {
        /* Dimensões e Espaçamento do Conteúdo Principal */
        margin-left: 80px; /* Deve corresponder à largura da sidebar */
        padding: 15px;
        width: calc(100% - 80px); /* Largura total menos a sidebar */
        /* Comportamento do Conteúdo Principal */
        transition: margin-left 0.3s ease-in-out;
        overflow-y: auto; /* Permite rolagem se o conteúdo exceder a altura */
      }
      .sidebar.hide + .main-content {
        margin-left: 0; /* Ajusta a margem quando a sidebar está oculta */
        width: 100%;
      }
      /* === FIM ESTILOS CONTEÚDO PRINCIPAL === */

      /* === INÍCIO ESTILOS BARRA SUPERIOR (TOP BAR) === */
      .top-bar {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }
      .menu-btn {
        /* Botão de menu (hambúrguer) */
        background: none;
        border: none;
        color: #fff;
        font-size: 2em; /* Tamanho do ícone do menu */
        cursor: pointer;
      }
      .top-bar h1 {
        /* Título da Página */
        font-size: 2.5em; /* Tamanho da fonte do título */
        text-align: center;
        flex-grow: 1;
      }
      .top-bar .dummy {
        width: 2.2em; /* Espaço reservado para alinhar o título, se necessário */
      }
      /* === FIM ESTILOS BARRA SUPERIOR (TOP BAR) === */

      /* === INÍCIO ESTILOS CONTAINER DO MAPA === */
      #map {
        /* Dimensões do Mapa */
        height: 60vh; /* Altura relativa à tela (viewport height) */
        width: 100%; /* Largura total do container pai */
        /* Aparência do Mapa */
        border-radius: 15px;
        margin-bottom: 20px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      }
      /* === FIM ESTILOS CONTAINER DO MAPA === */

      /* === INÍCIO ESTILOS PAINEL DE CONTROLE DA LUMINÁRIA === */
      .luminaire-controls {
        /* O "box" para os controles */
        /* Aparência do Painel */
        background-color: #2f3b58;
        border-radius: 10px;
        padding: 20px; /* Espaçamento interno */
        text-align: center;
      }
      .luminaire-controls h3 {
        /* Título dentro do painel */
        color: #ffd700;
        margin-bottom: 10px;
        font-size: 1.5em; /* Tamanho da fonte do nome da luminária */
      }
      .luminaire-controls p {
        /* Texto de status dentro do painel */
        margin-bottom: 15px;
        font-size: 1em; /* Tamanho da fonte do status */
      }
      .luminaire-controls button {
        /* Botões de controle */
        /* Dimensões e Espaçamento dos Botões */
        padding: 10px 20px;
        margin: 5px;
        /* Aparência dos Botões */
        background-color: #02d7fd;
        color: #1f2a44;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.9em; /* Tamanho da fonte nos botões */
      }
      .luminaire-controls button:hover {
        background-color: #0197c1;
      }
      /* === FIM ESTILOS PAINEL DE CONTROLE DA LUMINÁRIA === */

      /* Ajustes Responsivos */
      @media (max-width: 768px) {
        .top-bar h1 {
          font-size: 1.8em;
        }
        #map {
          height: 50vh;
        } /* Altura do mapa em telas menores */
        .main-content {
          margin-left: 0;
          width: 100%;
        }
        .sidebar.hide + .main-content {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <a href="/">
        <img
          src="{{ url_for('static', filename='loguinho.png') }}"
          alt="PUC Logo"
          class="logo"
        />
      </a>

      <div class="nav-item">
        <a href="/temperatura" title="Gráfico de Temperatura">
          <i class="fas fa-thermometer-half"></i>
        </a>
      </div>
      <div class="nav-item">
        <a href="/dados" title="Dashboard de Dados">
          <i class="fas fa-chart-line"></i>
        </a>
      </div>
      <div class="nav-item">
        <a href="/luminaires" title="Controle de Luminárias">
          <i class="fas fa-lightbulb"></i>
        </a>
      </div>
      <div class="nav-item who-we-are">
        <a href="/about" title="Sobre Nós">
          <i class="fas fa-info-circle"></i>
        </a>
      </div>
    </aside>
    <div class="main-content" id="mainContent">
      <div class="top-bar">
        <button class="menu-btn" onclick="toggleSidebarVisibility()">
          <i class="fas fa-bars"></i>
        </button>
        <h1>Controle de Luminárias</h1>
        <div class="dummy"></div>
      </div>

      <div id="map"></div>

      <div
        class="luminaire-controls"
        id="luminaireControlPanel"
        style="display: none"
      >
        <h3 id="luminaireName">Nome da Luminária</h3>
        <p id="luminaireStatus">Status: Desconhecido</p>
        <button onclick="controlLuminaire('on')">Ligar</button>
        <button onclick="controlLuminaire('off')">Desligar</button>
        <button onclick="controlLuminaire('dim_up')">Dimmer +</button>
        <button onclick="controlLuminaire('dim_down')">Dimmer -</button>
      </div>
      <div
        id="noLuminaireSelected"
        style="text-align: center; margin-top: 20px"
      >
        <p>Clique em uma luminária no mapa para ver as opções de controle.</p>
      </div>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      // Função para alternar a visibilidade da sidebar
      function toggleSidebarVisibility() {
        const sb = document.getElementById("sidebar");
        const mc = document.getElementById("mainContent");
        sb.classList.toggle("hide");
        mc.style.marginLeft = sb.classList.contains("hide") ? "0" : "80px";
      }

      // Dados das luminárias (recebidos do backend Flask)
      const luminairesData = JSON.parse('{{ luminaires_data|tojson|safe }}');
      console.log("Dados recebidos:", luminairesData);
      let selectedLuminaireId = null; // Armazena o ID da luminária selecionada

      // Configuração e Inicialização do Mapa Leaflet
      const map = L.map("map").setView([-22.83408, -47.04319], 16); // Ponto central e zoom inicial

      L.tileLayer(
        "https://api.maptiler.com/maps/dataviz/{z}/{x}/{y}.png?key=RZXpb9LpxsGCRktNA6mT",
        {
          attribution:
            '&copy; <a href="https://www.maptiler.com/">MapTiler</a> & <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
          tileSize: 512,
          zoomOffset: -1,
          minZoom: 1,
          maxZoom: 20,
        }
      ).addTo(map);

      // Loop para adicionar marcadores (pins) no mapa para cada luminária
      luminairesData.forEach((luminaire) => {
        const marker = L.marker([luminaire.lat, luminaire.lon]).addTo(map);
        marker.bindPopup(`<b>${luminaire.name}</b><br>Clique para controlar.`); // Popup ao clicar no marcador
        marker.on("click", () => {
          // Ação ao clicar no marcador
          selectedLuminaireId = luminaire.id;
          document.getElementById("luminaireName").textContent = luminaire.name;
          document.getElementById("luminaireStatus").textContent =
            "Status: Pronta para controle"; // Atualiza painel
          document.getElementById("luminaireControlPanel").style.display =
            "block"; // Mostra painel
          document.getElementById("noLuminaireSelected").style.display = "none"; // Esconde msg padrão
          console.log(
            `Luminaire selecionada: ${luminaire.name} (ID: ${luminaire.id})`
          );
        });
      });

      // Função de Controle da Luminária (PLACEHOLDER)
      // Esta função será modificada para enviar requisições à API do provedor da fotocélula
      function controlLuminaire(action) {
        if (selectedLuminaireId !== null) {
          alert(
            `Ação: ${action} para Luminária ID: ${selectedLuminaireId}\n(Integração com API externa pendente)`
          );
          // Exemplo de como a chamada à API poderia ser (descomentar e adaptar no futuro):
          // fetch(`/api/provider/luminaires/${selectedLuminaireId}/${action}`, { method: 'POST' })
          //   .then(response => response.json())
          //   .then(data => {
          //     console.log('Sucesso na API:', data);
          //     document.getElementById('luminaireStatus').textContent = `Status: ${data.status_atual}`;
          //   })
          //   .catch((error) => {
          //     console.error('Erro na API:', error);
          //     document.getElementById('luminaireStatus').textContent = "Status: Erro ao comunicar com API";
          //   });
        } else {
          alert(
            "Nenhuma luminária selecionada. Clique em uma luminária no mapa primeiro."
          );
        }
      }
    </script>
  </body>
</html>
